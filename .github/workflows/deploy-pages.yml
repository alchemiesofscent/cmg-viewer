name: Build and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      snapshot_tag:
        description: 'Optional published corpus tag to restore (blank uses committed pin)'
        required: false
        type: string
  workflow_run:
    workflows: [Refresh corpus]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  snapshot:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.pin.outputs.ready }}
      revision: ${{ steps.pin.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - id: pin
        env:
          SNAPSHOT_TAG: ${{ inputs.snapshot_tag }}
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if test -f config/corpus-snapshot.json || test -n "$SNAPSHOT_TAG"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Waiting for the first validated corpus refresh; no site was replaced." >> "$GITHUB_STEP_SUMMARY"
          fi
  build:
    needs: snapshot
    if: needs.snapshot.outputs.ready == 'true'
    name: Test and build from saved corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.snapshot.outputs.revision }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile

      - run: pnpm test
      - name: Restore the pinned corpus without contacting BBAW
        env:
          SNAPSHOT_TAG: ${{ inputs.snapshot_tag }}
        run: |
          if test -n "$SNAPSHOT_TAG"; then
            python scripts/corpus_snapshot.py restore --tag "$SNAPSHOT_TAG"
          else
            python scripts/corpus_snapshot.py restore
          fi
      - run: pnpm build
      - run: pnpm validate
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
