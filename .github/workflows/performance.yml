name: Live reading measurements
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
  pull_request:
    paths:
      - 'tests/performance/**'
      - 'playwright.performance.config.js'
      - '.github/workflows/performance.yml'
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --config playwright.performance.config.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-loading-measurements
          path: |
            performance-results/
            test-results/
          retention-days: 30
