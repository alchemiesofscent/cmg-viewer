name: Tag reader release
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'CHANGELOG.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reader-release
  cancel-in-progress: false
jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Publish the package.json version once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already released"
            exit 0
          fi
          # Release notes are the CHANGELOG section for this version.
          awk -v heading="## $VERSION" '$0 == heading { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no '## $VERSION' section" >&2
            exit 1
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "CMG Reader $TAG" --notes-file release-notes.md --latest
